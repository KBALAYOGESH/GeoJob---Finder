<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoJobs</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #31F8C3;
      --primary-dark: #1dd4a3;
      --dark: #1a1a2e;
      --dark2: #16213e;
      --card-bg: #ffffff;
      --text: #2d2d2d;
      --text-muted: #888;
      --border: #e5e7eb;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      --radius: 14px;
      --sidebar: 380px;
    }

    html {
      font-size: 62.5%;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f4f6fb;
      color: var(--text);
      min-height: 100vh;
      font-size: 1.5rem;
    }

    /* ─── HEADER ─── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--dark);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.18);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 1.2rem 3rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .topnav-left {
      display: flex;
      align-items: center;
      gap: 1.8rem;
    }

    .topnav-right {
      display: flex;
      align-items: center;
      gap: 1.4rem;
    }

    .topnav-links {
      display: flex;
      align-items: center;
      gap: 1.6rem;
    }

    .topnav-link {
      color: rgba(255, 255, 255, 0.85);
      font-size: 1.35rem;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.18s;
      white-space: nowrap;
    }

    .topnav-link:hover {
      color: #fff;
    }

    .nav-pill {
      height: 36px;
      padding: 0 1.4rem;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: .2px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: transparent;
      color: #fff;
      transition: all 0.18s;
      white-space: nowrap;
    }

    .nav-pill:hover {
      border-color: rgba(49, 248, 195, 0.6);
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-pill.primary {
      border-color: rgba(49, 248, 195, 0.7);
      background: rgba(49, 248, 195, 0.18);
      color: #fff;
    }

    .nav-pill.primary:hover {
      background: rgba(49, 248, 195, 0.28);
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      white-space: nowrap;
      text-decoration: none;
    }

    .logo span {
      color: #fff;
    }

    .auth-form {
      display: grid;
      gap: 1.2rem;
    }

    .auth-row {
      display: grid;
      gap: .6rem;
    }

    .auth-row label {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .auth-row input,
    .auth-row select {
      width: 100%;
      padding: 1rem 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1.4rem;
      font-family: inherit;
      outline: none;
    }

    .auth-row input:focus,
    .auth-row select:focus {
      border-color: var(--primary);
    }

    .auth-actions {
      display: flex;
      gap: 1rem;
      margin-top: .4rem;
    }

    .auth-actions button {
      flex: 1;
      padding: 1rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      font-family: inherit;
      transition: background .2s;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--dark);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-ghost {
      background: #fff;
      border: 1.5px solid var(--border);
      color: var(--dark2);
    }

    .auth-msg {
      font-size: 1.3rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .auth-msg.error {
      color: #b42318;
      font-weight: 700;
    }

    #searchForm {
      display: flex;
      align-items: center;
      flex: 1;
      max-width: none;
      background: #fff;
      border: 1.5px solid rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    #searchForm:focus-within {
      border-color: var(--primary);
    }

    #searchForm input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 1.1rem 1.6rem;
      font-size: 1.4rem;
      color: var(--text);
      font-family: inherit;
    }

    #searchForm input::placeholder {
      color: rgba(0, 0, 0, 0.45);
    }

    .form-divider {
      width: 1px;
      height: 2.2rem;
      background: rgba(0, 0, 0, 0.15);
    }

    #searchForm button {
      background: var(--primary);
      border: none;
      padding: 1.1rem 2rem;
      cursor: pointer;
      color: var(--dark);
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: .6rem;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #searchForm button:hover {
      background: var(--primary-dark);
    }

    .header-bottom {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 1.2rem 3rem;
      background: rgba(0, 0, 0, 0.03);
    }

    .hdr-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: .7rem 1.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.3rem;
      font-family: inherit;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: .6rem;
      transition: all 0.2s;
    }

    .hdr-btn:hover,
    .hdr-btn.active {
      background: var(--primary);
      color: var(--dark);
      border-color: var(--primary);
    }

    /* Filters dropdown */
    .filters-wrapper {
      position: relative;
    }

    .filters-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 1rem);
      left: 0;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      padding: 2rem;
      width: 300px;
      z-index: 200;
    }

    .filters-dropdown.open {
      display: block;
    }

    .filter-group {
      margin-bottom: 1.8rem;
    }

    .filter-label {
      display: block;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: .8rem;
    }

    .filter-select {
      width: 100%;
      padding: .9rem 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1.4rem;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
      cursor: pointer;
    }

    .filter-select:focus {
      border-color: var(--primary);
    }

    .radio-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: 1.3rem;
      cursor: pointer;
      padding: .5rem 1rem;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      transition: all 0.18s;
    }

    .radio-label:has(input:checked) {
      border-color: var(--primary);
      background: rgba(49, 248, 195, 0.1);
      color: var(--dark);
      font-weight: 600;
    }

    .radio-label input {
      display: none;
    }

    .filter-apply {
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      font-size: 1.4rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      color: var(--dark);
      transition: background 0.2s;
    }

    .filter-apply:hover {
      background: var(--primary-dark);
    }

    /* ─── CATEGORY NAV ─── */
    #cat-nav {
      width: 200px;
      min-width: 200px;
      background: var(--dark);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      border-right: 1px solid rgba(255, 255, 255, 0.07);
    }

    #cat-nav::-webkit-scrollbar {
      width: 3px;
    }

    #cat-nav::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
    }

    .cat-header {
      padding: 1.6rem 1.4rem 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .cat-btn {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .9rem 1.4rem;
      border: none;
      background: none;
      color: rgba(255, 255, 255, 0.7);
      font-family: inherit;
      font-size: 1.3rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: all 0.18s;
      border-left: 3px solid transparent;
    }

    .cat-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .cat-btn.active {
      background: rgba(49, 248, 195, 0.1);
      color: var(--primary);
      border-left-color: var(--primary);
      font-weight: 600;
    }

    .cat-icon {
      font-size: 1.5rem;
      width: 2rem;
      text-align: center;
    }

    .cat-count {
      margin-left: auto;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      font-size: 1rem;
      padding: .2rem .6rem;
      border-radius: 10px;
      font-weight: 600;
    }

    .cat-btn.active .cat-count {
      background: rgba(49, 248, 195, 0.2);
      color: var(--primary);
    }

    /* ─── MAIN LAYOUT ─── */
    main {
      display: flex;
      margin-top: 140px;
      height: calc(100vh - 140px);
      overflow: hidden;
    }

    /* ─── SIDEBAR ─── */
    #sidebar {
      width: var(--sidebar);
      min-width: var(--sidebar);
      background: #f4f6fb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }

    .sidebar-header {
      padding: 1.8rem 2rem 1rem;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .search-desc {
      font-size: 1.3rem;
      color: var(--text-muted);
      margin-bottom: .4rem;
    }

    .result-count {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--dark);
    }

    .result-count span {
      color: var(--primary-dark);
    }

    #results-list {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    #results-list::-webkit-scrollbar {
      width: 4px;
    }

    #results-list::-webkit-scrollbar-track {
      background: transparent;
    }

    #results-list::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 2px;
    }

    /* ─── JOB CARD ─── */
    .job-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.8rem;
      box-shadow: var(--shadow);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.22s;
      animation: slideIn 0.3s ease both;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .job-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .job-card.active {
      border-color: var(--primary);
      background: #f0fefb;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 1.2rem;
      margin-bottom: 1rem;
    }

    .company-logo {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #6ee7f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--dark);
      flex-shrink: 0;
    }

    .card-title-group {
      flex: 1;
      min-width: 0;
    }

    .job-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: .2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .company-name {
      font-size: 1.3rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      margin-bottom: 1rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-size: 1.2rem;
      padding: .35rem .9rem;
      border-radius: 20px;
      font-weight: 500;
    }

    .tag-location {
      background: #f0f4ff;
      color: #4361ee;
    }

    .tag-type {
      background: #f0fdf4;
      color: #16a34a;
    }

    .tag-salary {
      background: #fef9c3;
      color: #ca8a04;
    }

    .card-desc {
      font-size: 1.3rem;
      color: var(--text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.2rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border);
    }

    .card-date {
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    .apply-btn {
      background: var(--dark);
      color: var(--primary);
      border: none;
      padding: .6rem 1.4rem;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.18s;
    }

    .apply-btn:hover {
      background: var(--primary);
      color: var(--dark);
    }

    /* ─── MAP AREA ─── */
    #map-container {
      flex: 1;
      position: relative;
      min-height: 400px;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Custom Leaflet marker styles */
    .leaflet-pin {
      background: var(--dark);
      color: var(--primary);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      font-family: 'DM Sans', sans-serif;
      border: 2px solid rgba(49, 248, 195, 0.3);
      cursor: pointer;
      transition: all 0.2s;
    }

    .leaflet-pin.active {
      background: var(--primary);
      color: var(--dark);
      border-color: var(--dark);
      transform: scale(1.1);
    }

    .leaflet-pin::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--dark);
      border-bottom: none;
    }

    .leaflet-pin.active::after {
      border-top-color: var(--primary);
    }

    /* Job detail popup on map */
    #job-detail {
      position: absolute;
      right: 2rem;
      top: 2rem;
      width: 320px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      padding: 2rem;
      z-index: 1000;
      display: none;
      animation: popIn 0.25s ease;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(-8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    #job-detail.visible {
      display: block;
    }

    .detail-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .detail-logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #6ee7f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 1.2rem;
    }

    .detail-title {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: .3rem;
    }

    .detail-company {
      font-size: 1.3rem;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      margin-bottom: 1.2rem;
    }

    .detail-desc {
      font-size: 1.3rem;
      color: #555;
      line-height: 1.7;
      margin-bottom: 1.4rem;
    }

    .detail-apply {
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      font-size: 1.4rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      color: var(--dark);
      transition: background 0.2s;
    }

    .detail-apply:hover {
      background: var(--primary-dark);
    }

    /* ─── MODALS ─── */
    #past-modal,
    #auth-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }

    #past-modal.open,
    #auth-modal.open {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 3rem;
      width: 500px;
      max-width: 95vw;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
      animation: popIn 0.25s ease;
    }

    .modal-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: var(--dark);
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .past-chip {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: var(--dark);
      color: var(--primary);
      border: none;
      padding: .8rem 1.4rem;
      border-radius: 20px;
      font-size: 1.3rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin: .4rem;
      transition: all 0.18s;
    }

    .past-chip:hover {
      background: var(--primary);
      color: var(--dark);
    }

    .no-past {
      color: var(--text-muted);
      font-size: 1.4rem;
      text-align: center;
      padding: 2rem 0;
    }

    /* ─── EMPTY STATE ─── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 3rem;
      gap: 1.2rem;
    }

    #empty-state i {
      font-size: 4rem;
      opacity: .3;
    }

    #empty-state h3 {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text);
    }

    #empty-state p {
      font-size: 1.3rem;
      line-height: 1.6;
    }

    /* ─── MOBILE ─── */
    #mob-map-btn {
      display: none;
      position: fixed;
      right: 2rem;
      bottom: 2rem;
      z-index: 80;
      background: var(--primary);
      color: var(--dark);
      border: none;
      border-radius: 50%;
      width: 58px;
      height: 58px;
      font-size: 2.2rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(49, 248, 195, 0.4);
    }

    /* Loading */
    #loader {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 1.2rem;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      main {
        flex-direction: column;
        height: auto;
        margin-top: 135px;
      }

      #cat-nav {
        width: 100%;

    function apiFetch(path, options = {}) {
      const accessToken = localStorage.getItem('gj_accessToken');
      const headers = new Headers(options.headers || {});
      headers.set('Accept', 'application/json');
      if (accessToken) headers.set('Authorization', `Bearer ${accessToken}`);
      return fetch(`${API_BASE}${path}`, { ...options, headers });
    }

    function formatSalary(job) {
      const cur = job.currency || 'GBP';
      const sym = cur === 'GBP' ? '£' : (cur === 'USD' ? '$' : `${cur} `);
      if (Number.isFinite(job.salaryMin) && Number.isFinite(job.salaryMax)) return `${sym}${job.salaryMin.toLocaleString()}–${sym}${job.salaryMax.toLocaleString()}`;
      if (Number.isFinite(job.salaryMax)) return `${sym}${job.salaryMax.toLocaleString()}`;
      if (Number.isFinite(job.salaryMin)) return `${sym}${job.salaryMin.toLocaleString()}`;
      return 'Salary not specified';
    }

    function pickEmoji(job) {
      const c = (job.category || '').toLowerCase();
      if (c.includes('tech') || c.includes('it')) return '💻';
      if (c.includes('health')) return '🏥';
      if (c.includes('admin') || c.includes('sales')) return '📋';
      if (c.includes('creative') || c.includes('media')) return '🎨';
      if (c.includes('education')) return '📚';
      if (c.includes('service') || c.includes('trade')) return '🔧';
      return '💼';
    }

    function mapApiJob(apiJob) {
      return {
        id: apiJob._id,
        category: apiJob.category || 'All',
        title: apiJob.title,
        company: apiJob.companyName,
        location: apiJob.location || '',
        salary: formatSalary(apiJob),
        type: apiJob.type || 'full-time',
        contract: apiJob.type || '',
        desc: apiJob.description || '',
        emoji: pickEmoji(apiJob),
        url: '#',
        lat: apiJob.lat,

      };
    }

    // ─── ELEMENTS ────────────────────────────────────────────────────────────────
    const searchForm = document.getElementById('searchForm');
    const jobInput = document.getElementById('job-input');
    const locInput = document.getElementById('loc-input');
    const resultsList = document.getElementById('results-list');
    const emptyState = document.getElementById('empty-state');
    const loader = document.getElementById('loader');
    const sidebarHeader = document.getElementById('sidebar-header');
    const searchDesc = document.getElementById('search-desc');
    const resultCount = document.getElementById('result-count');
    const jobDetail = document.getElementById('job-detail');
    const pastModal = document.getElementById('past-modal');
    const pastList = document.getElementById('past-list');
    const filtersDropdown = document.getElementById('filters-dropdown');
    const authModal = document.getElementById('auth-modal');
    const loginBtn = document.getElementById('login-btn');
    const signupBtn = document.getElementById('signup-btn');
    const authClose = document.getElementById('auth-close');
    const authStatus = document.getElementById('auth-status');
    const authForm = document.getElementById('auth-form');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const authRole = document.getElementById('auth-role');
    const authRegisterBtn = document.getElementById('auth-register-btn');
    const authLogoutBtn = document.getElementById('auth-logout-btn');
    const authApiBtn = document.getElementById('auth-api-btn');

    function setAuthUi() {
      const token = localStorage.getItem('gj_accessToken');
      const api = localStorage.getItem('gj_api') || API_BASE;
      if (token) {
        loginBtn.textContent = 'ACCOUNT';
        signupBtn.style.display = 'none';
        authLogoutBtn.style.display = 'inline-flex';
        authStatus.textContent = `Logged in. API: ${api}`;
        authStatus.classList.remove('error');
      } else {
        loginBtn.textContent = 'LOGIN';
        signupBtn.style.display = '';
        authLogoutBtn.style.display = 'none';
        authStatus.textContent = `Not logged in. API: ${api}`;
        authStatus.classList.remove('error');
      }
    }

    // ─── INIT LEAFLET MAP ────────────────────────────────────────────────────────
    function initMap() {
      leafletMap = L.map('map', { zoomControl: true }).setView([54.0, -2.5], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 18,
      }).addTo(leafletMap);
    }

    // ─── CREATE CUSTOM MARKER ────────────────────────────────────────────────────
    function createMarker(job) {
      if (typeof job.lat !== 'number' || typeof job.lng !== 'number') return null;
      const salaryShort = job.salary.split('–')[0].trim();
      const icon = L.divIcon({
        className: '',
        html: `<div class="leaflet-pin" id="pin-${job.id}">${salaryShort}</div>`,
        iconAnchor: [0, 32],
      });
      const marker = L.marker([job.lat, job.lng], { icon }).addTo(leafletMap);
      marker.on('click', () => selectJob(job.id));
      return marker;
    }

    // ─── SEARCH ──────────────────────────────────────────────────────────────────
    searchForm.addEventListener('submit', e => {
      e.preventDefault();
      const role = jobInput.value.trim();
      const loc = locInput.value.trim();
      if (!role && !loc) return;
      doSearch(role, loc);
    });

    async function doSearch(role, loc) {
      jobInput.value = role;
      locInput.value = loc;

      const key = `${role} · ${loc}`;
      if (key.trim() !== '·' && !pastSearches.includes(key)) {
        pastSearches.unshift(key);
        if (pastSearches.length > 10) pastSearches.pop();
        localStorage.setItem('gj_past', JSON.stringify(pastSearches));
      }

      emptyState.style.display = 'none';
      loader.style.display = 'flex';
      sidebarHeader.style.display = 'none';
      clearCards();
      clearMarkers();
      jobDetail.classList.remove('visible');

      const mockFilter = j => {
        const matchCat = activeCategory === 'All' || j.category === activeCategory;
        const matchRole = !role || j.title.toLowerCase().includes(role.toLowerCase()) || j.company.toLowerCase().includes(role.toLowerCase());
        const matchLoc = !loc || j.location.toLowerCase().includes(loc.toLowerCase());
        return matchCat && matchRole && matchLoc;
      };

      try {
        const params = new URLSearchParams();
        if (role) params.set('q', role);
        if (loc) params.set('location', loc);
        if (activeCategory && activeCategory !== 'All') params.set('category', activeCategory);
        params.set('sort', role ? 'relevance' : 'latest');
        params.set('limit', '50');

        const res = await apiFetch(`/jobs?${params.toString()}`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error?.message || 'Failed to load jobs');

        currentJobs = (data.items || []).map(mapApiJob);

        // Fallback to mock data if backend has no jobs yet
        if (currentJobs.length === 0) {
          currentJobs = MOCK_JOBS.filter(mockFilter);
        }

        loader.style.display = 'none';
        renderResults(role, loc);
      } catch (err) {
        loader.style.display = 'none';
        currentJobs = MOCK_JOBS.filter(mockFilter);
        renderResults(role, loc);
        console.error(err);
      }
    }

    // ─── RENDER RESULTS ──────────────────────────────────────────────────────────
    function renderResults(role, loc) {
      sidebarHeader.style.display = 'block';
      searchDesc.textContent = `"${role || 'All'}" in "${loc || 'UK'}"`;
      resultCount.innerHTML = `<span>${currentJobs.length}</span> jobs found`;

      clearCards();
      clearMarkers();

      const bounds = [];

      currentJobs.forEach((job, i) => {
        // ── Card ──
        const card = document.createElement('div');
        card.className = 'job-card';
        card.style.animationDelay = `${i * 0.05}s`;
        card.dataset.id = job.id;
        card.innerHTML = `
      <div class="card-top">
        <div class="company-logo">${job.emoji}</div>
        <div class="card-title-group">
          <div class="job-title">${job.title}</div>
          <div class="company-name">${job.company}</div>
        </div>
      </div>
      <div class="card-tags">
        <span class="tag tag-location"><i class="fas fa-map-marker-alt"></i> ${job.location}</span>
        <span class="tag tag-type"><i class="fas fa-clock"></i> ${job.type}</span>
        <span class="tag tag-salary"><i class="fas fa-pound-sign"></i> ${job.salary}</span>
      </div>
      <div class="card-desc">${job.desc}</div>
      <div class="card-footer">
        <span class="card-date"><i class="fas fa-calendar-alt"></i> Posted today</span>
        <button class="apply-btn" onclick="event.stopPropagation(); window.location.href='apply.html?' + new URLSearchParams({ jobId: job.id, title: job.title, company: job.company, location: job.location }).toString()">Apply <i class="fas fa-arrow-right"></i></button>
      </div>`;
        card.addEventListener('click', () => selectJob(job.id));
        resultsList.appendChild(card);

        // ── Leaflet marker ──
        const marker = createMarker(job);
        if (marker) {
          leafletMarkers[job.id] = marker;
          bounds.push([job.lat, job.lng]);
        }
      });

      // Fit map to show all markers
      if (bounds.length > 0) {
        leafletMap.fitBounds(bounds, { padding: [40, 40] });
      }
    }

    // ─── SELECT JOB ──────────────────────────────────────────────────────────────
    function selectJob(id) {
      activeJobId = id;
      const job = currentJobs.find(j => j.id === id);
      if (!job) return;

      // Highlight card
      document.querySelectorAll('.job-card').forEach(c =>
        c.classList.toggle('active', +c.dataset.id === id));

      // Highlight markers
      document.querySelectorAll('.leaflet-pin').forEach(p =>
        p.classList.remove('active'));
      const pinEl = document.getElementById(`pin-${id}`);
      if (pinEl) pinEl.classList.add('active');

      // Scroll card into view
      const activeCard = document.querySelector(`.job-card[data-id="${id}"]`);
      if (activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // Pan map to job location
      leafletMap.panTo([job.lat, job.lng], { animate: true, duration: 0.5 });

      // Show detail popup
      document.getElementById('detail-logo').textContent = job.emoji;
      document.getElementById('detail-title').textContent = job.title;
      document.getElementById('detail-company').textContent = `${job.company} · ${job.location}`;
      document.getElementById('detail-tags').innerHTML = `
    <span class="tag tag-type">${job.type}</span>
    <span class="tag tag-salary">${job.salary}</span>
    <span class="tag tag-location">${job.contract}</span>`;
      document.getElementById('detail-desc').textContent = job.desc;
      document.getElementById('detail-apply').onclick = () => {
        const qs = new URLSearchParams({
          jobId: job.id,
          title: job.title,
          company: job.company,
          location: job.location
        });
        window.location.href = `apply.html?${qs.toString()}`;
      };
      jobDetail.classList.add('visible');
    }

    document.getElementById('detail-close').addEventListener('click', () => {
      jobDetail.classList.remove('visible');
      document.querySelectorAll('.job-card').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.leaflet-pin').forEach(p => p.classList.remove('active'));
      activeJobId = null;
    });

    // ─── HELPERS ─────────────────────────────────────────────────────────────────
    function clearCards() {
      document.querySelectorAll('.job-card').forEach(c => c.remove());
    }
    function clearMarkers() {
      Object.values(leafletMarkers).forEach(m => leafletMap.removeLayer(m));
      leafletMarkers = {};
    }

    // ─── FILTERS ─────────────────────────────────────────────────────────────────
    document.getElementById('filters-btn').addEventListener('click', e => {
      e.stopPropagation();
      filtersDropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => filtersDropdown.classList.remove('open'));
    filtersDropdown.addEventListener('click', e => e.stopPropagation());
    document.getElementById('filter-apply').addEventListener('click', () => {
      filtersDropdown.classList.remove('open');
      doSearch(jobInput.value.trim(), locInput.value.trim());
    });

    // ─── PAST SEARCHES ───────────────────────────────────────────────────────────
    document.getElementById('past-btn').addEventListener('click', () => {
      renderPastSearches();
      pastModal.classList.add('open');
    });
    document.getElementById('modal-close').addEventListener('click', () => pastModal.classList.remove('open'));
    pastModal.addEventListener('click', e => { if (e.target === pastModal) pastModal.classList.remove('open'); });

    // ─── AUTH / PROFILE ───────────────────────────────────────────────────────────
    setAuthUi();

    function openAuthModal(mode) {
      setAuthUi();
      if (mode === 'register') {
        authRegisterBtn.focus();
      } else {
        authEmail.focus();
      }
      authModal.classList.add('open');
    }

    loginBtn.addEventListener('click', () => openAuthModal('login'));
    signupBtn.addEventListener('click', () => openAuthModal('register'));
    authClose.addEventListener('click', () => authModal.classList.remove('open'));
    authModal.addEventListener('click', e => { if (e.target === authModal) authModal.classList.remove('open'); });

    async function authFetch(path, options = {}) {
      const headers = new Headers(options.headers || {});
      headers.set('Accept', 'application/json');
      headers.set('Content-Type', 'application/json');
      return fetch(`${API_BASE}${path}`, { ...options, headers });
    }

    function showAuthError(msg) {
      authStatus.textContent = msg;
      authStatus.classList.add('error');
    }

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authStatus.classList.remove('error');
      authStatus.textContent = 'Logging in...';

      try {
        const res = await authFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: authEmail.value.trim(), password: authPassword.value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error?.message || 'Login failed');

        localStorage.setItem('gj_accessToken', data?.tokens?.accessToken || '');
        localStorage.setItem('gj_refreshToken', data?.tokens?.refreshToken || '');
        setAuthUi();
        authModal.classList.remove('open');
      } catch (err) {
        showAuthError(err.message);
      }
    });

    authRegisterBtn.addEventListener('click', async () => {
      authStatus.classList.remove('error');
      authStatus.textContent = 'Registering...';

      try {
        const res = await authFetch('/auth/register', {
          method: 'POST',
          body: JSON.stringify({ email: authEmail.value.trim(), password: authPassword.value, role: authRole.value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error?.message || 'Register failed');

        localStorage.setItem('gj_accessToken', data?.tokens?.accessToken || '');
        localStorage.setItem('gj_refreshToken', data?.tokens?.refreshToken || '');
        setAuthUi();
        authModal.classList.remove('open');
      } catch (err) {
        showAuthError(err.message);
      }
    });

    authLogoutBtn.addEventListener('click', () => {
      localStorage.removeItem('gj_accessToken');
      localStorage.removeItem('gj_refreshToken');
      setAuthUi();
      authModal.classList.remove('open');
    });

    const authGoogleBtn = document.getElementById('auth-google-btn');
    authGoogleBtn.addEventListener('click', () => {
      // Use the Google Identity Services to trigger the account selection popup
      const client = google.accounts.oauth2.initTokenClient({
        client_id: 'YOUR_GOOGLE_CLIENT_ID', // TODO: Replace with your actual Google Client ID
        scope: 'email profile',
        callback: (response) => {
          if (response && response.access_token) {
            // Here you would typically send the token to your backend
            // For now, we just simulate a successful UI state update
            authStatus.textContent = 'Google Auth successful! (Backend integration pending)';
            authStatus.classList.remove('error');
            authStatus.style.color = 'var(--primary-dark)';
          }
        },
      });
      client.requestAccessToken();
    });

    authApiBtn.addEventListener('click', () => {
      const current = localStorage.getItem('gj_api') || API_BASE;
      const next = prompt('Backend API base (example: http://localhost:4000/api)', current);
      if (next && next.trim()) {
        localStorage.setItem('gj_api', next.trim());
        location.reload();
      }
    });

    function renderPastSearches() {
      if (pastSearches.length === 0) {
        pastList.innerHTML = '<div class="no-past">No past searches yet. Try searching for a job!</div>';
        return;
      }
      pastList.innerHTML = pastSearches.map(s => {
        const [role, loc] = s.split(' · ');
        return `<button class="past-chip" onclick="pastSearch('${role}','${loc || ''}')">${s} <i class="fas fa-search"></i></button>`;
      }).join('');
    }

    function pastSearch(role, loc) {
      pastModal.classList.remove('open');
      doSearch(role, loc);
    }

    // ─── CATEGORY NAV ────────────────────────────────────────────────────────────
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        doSearch(jobInput.value.trim(), locInput.value.trim());
      });
    });

    // ─── MOBILE MAP TOGGLE ───────────────────────────────────────────────────────
    document.getElementById('mob-map-btn').addEventListener('click', () => {
      const mc = document.getElementById('map-container');
      mc.classList.toggle('mob-open');
      if (mc.classList.contains('mob-open')) {
        setTimeout(() => leafletMap.invalidateSize(), 310);
      }
    });

    // ─── BOOT ────────────────────────────────────────────────────────────────────
    initMap();
    doSearch('', 'UK');
  </script>
</body>

</html>
